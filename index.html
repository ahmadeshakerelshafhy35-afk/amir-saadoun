<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة أمير سعدون — أحياء وجيولوجيا</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;--bg:#f2f5ff;--card:#fff;--tx:#0b1440;--mut:#58628c;--gold:#d99a05;--gold2:#f7c545;--pr:#3b2bd6;--bd:#dbe2fb;--on:#fff;--bad:#c73b3b;--ok:#13894a}
:root[data-theme="dark"]{color-scheme:dark;--bg:#060c2a;--card:#0f1a45;--tx:#eef1ff;--mut:#a3aed8;--gold:#f7c545;--pr:#8a79ff;--bd:#233072;--bad:#ff8585;--ok:#5fe09a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#060c2a;--card:#0f1a45;--tx:#eef1ff;--mut:#a3aed8;--gold:#f7c545;--pr:#8a79ff;--bd:#233072;--bad:#ff8585;--ok:#5fe09a}}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.75}
a{color:inherit;text-decoration:none}
.w{max-width:1080px;margin:0 auto;padding:0 16px}
nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
nav .w{display:flex;align-items:center;gap:10px;height:62px}
.logo{font-family:'Aref Ruqaa',Cairo,serif;font-size:24px;color:var(--gold);cursor:pointer;margin-inline-end:auto;white-space:nowrap}
.nl{display:flex;gap:4px}.nl a{padding:6px 12px;border-radius:99px;color:var(--mut);font-weight:600;font-size:14px}.nl a:hover{background:var(--bg)}
@media(max-width:700px){.nl{display:none}}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:9px 18px;cursor:pointer;color:#1a1200;background:linear-gradient(135deg,var(--gold2),#ffb21e);display:inline-block;box-shadow:0 6px 18px rgba(247,197,69,.28)}
button.o{background:transparent;color:var(--tx);border:1px solid var(--bd);box-shadow:none}
button.s{padding:6px 12px;font-size:13px}
.hero{background:radial-gradient(circle at 80% 20%,#7a4dff55,transparent 45%),radial-gradient(circle at 10% 90%,#00c2ff33,transparent 40%),linear-gradient(135deg,#071150,#1c25b8 55%,#5a2fe0);color:#fff;overflow:hidden}
.hero .w{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;padding-top:36px;padding-bottom:36px}
@media(max-width:800px){.hero .w{grid-template-columns:1fr}.hero .ph{order:-1}}
.hero h1{font-family:'Aref Ruqaa',Cairo,serif;font-size:clamp(34px,6vw,58px);line-height:1.35;margin:0 0 10px;background:linear-gradient(90deg,#ffe28a,#f7c545,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:18px;opacity:.93;margin:0 0 20px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.chip{background:#ffffff1f;border:1px solid #ffffff40;border-radius:99px;padding:4px 14px;font-size:14px}
.ph{position:relative;max-width:400px;margin:auto;width:100%}
.ph:before{content:"";position:absolute;inset:-14px;border-radius:32px;background:conic-gradient(from 0deg,#f7c545,#7a4dff,#00c2ff,#f7c545);filter:blur(22px);opacity:.55}
.ph img{position:relative;width:100%;display:block;border-radius:26px;border:3px solid #f7c545;aspect-ratio:1;object-fit:cover}
h2.t{font-family:'Aref Ruqaa',Cairo,serif;font-size:34px;text-align:center;margin:44px 0 6px;color:var(--gold)}
.sub{text-align:center;color:var(--mut);margin:0 0 22px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.f{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px}.f i{font-style:normal;font-size:30px}.f h3{margin:6px 0 2px;font-size:17px}.f p{margin:0;color:var(--mut);font-size:14px}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none}.tabs button.on{background:linear-gradient(135deg,var(--gold2),#ffb21e);color:#1a1200;border-color:transparent}
.c{background:var(--card);border:1px solid var(--bd);border-radius:20px;overflow:hidden;cursor:pointer;transition:.25s}.c:hover{transform:translateY(-5px);box-shadow:0 14px 34px rgba(59,43,214,.25)}
.c .im{position:relative;aspect-ratio:1;background:#0b1440}.c img,.c svg{width:100%;height:100%;object-fit:cover;display:block}
.bd{position:absolute;top:10px;right:10px;background:#0b1440cc;color:#fff;border-radius:99px;padding:2px 12px;font-size:13px}
.c .b{padding:14px}.c h3{margin:0 0 8px;font-size:18px}.st{font-size:13px;margin-bottom:10px}.ok{color:var(--ok)}.bad{color:var(--bad)}.m{color:var(--mut)}
.cd{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin:14px 0}
input,select{width:100%;box-sizing:border-box;padding:11px 12px;margin:4px 0 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
label{font-size:14px;color:var(--mut)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.two{grid-template-columns:1fr}}
.ct{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.ct a{padding:14px 30px;border-radius:14px;font-weight:800;color:#fff;font-size:18px}
.wa{background:#1fa855}.tg{background:#229ed9}
.fab{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;width:54px;height:54px;border-radius:50%;background:#1fa855;color:#fff;display:grid;place-items:center;font-size:28px;box-shadow:0 8px 22px #0006}
footer{margin-top:50px;padding:24px 0 80px;text-align:center;color:var(--mut);border-top:1px solid var(--bd);font-size:14px}
.vl{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--bd);border-radius:14px;margin:8px 0;background:var(--card);cursor:pointer}.vl.lk{opacity:.6;cursor:default}
.pl{position:relative;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;margin:12px 0}.pl iframe{width:100%;height:100%;border:0;display:block}
.pl>*{position:absolute}.pl #yt,.pl iframe{inset:0;width:100%;height:100%}
.tp{top:0;left:0;right:0;height:58px;z-index:2;background:linear-gradient(#0b1440,#0b1440 70%,transparent)}
.sh{inset:0;z-index:3}
.cvr{inset:0;z-index:4;display:grid;place-items:center;text-align:center;padding:12px;background:radial-gradient(circle at 70% 20%,#7a4dff66,transparent 50%),linear-gradient(135deg,#071150,#2b27c9);color:#fff;cursor:pointer}
.cvr b{font-size:60px;display:block;line-height:1}
.cb{left:0;right:0;bottom:0;z-index:5;display:flex;gap:8px;align-items:center;padding:8px 10px;background:linear-gradient(transparent,#000c);color:#fff;direction:ltr;font-size:13px}
.cb input[type=range]{flex:1;margin:0;padding:0}.cb button,.cb select{background:#ffffff26;color:#fff;border:0;padding:4px 10px;border-radius:8px;box-shadow:none;font-size:14px;width:auto;margin:0}
.wm{position:absolute;z-index:6;pointer-events:none;color:#fff;opacity:.28;font-size:13px;font-weight:700;text-shadow:0 0 4px #000;top:30%;right:8%}
.tb{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid var(--bd);padding:7px 9px;text-align:right;white-space:nowrap}
.q{padding:10px 0;border-bottom:1px solid var(--bd)}.q label{display:block;color:var(--tx);padding:3px 0}.q input{width:auto;margin:0 0 0 8px}
.lb{position:fixed;inset:0;background:#000d;z-index:50;display:grid;place-items:center}.lb img{max-width:94%;max-height:90%;border-radius:10px}

b=`<div class="cd"><h3>توليد أكواد</h3><div class="two"><div><label>الفصل</label><select id="kc">${cop()}</select></div><div><label>العدد</label><input id="kn" type="number" value="10"></div></div><button onclick="gen()">توليد</button>${A.last.length?`<p>آخر دفعة (انسخها):</p><textarea dir="ltr" style="width:100%;height:120px" readonly>${A.last.join('\n')}</textarea>`:''}</div><div class="cd tb"><table><tr><th>الكود</th><th>الفصل</th><th>الحالة</th></tr>${cs.docs.map(d=>{const k=d.data();return `<tr><td dir="ltr">${d.id}</td><td>${esc(cv(k.cid).t)}</td><td>${k.used?'مستخدم — '+esc(nm[k.uid]||''):'متاح'}</td></tr>`}).join('')}</table></div>`}
if(t==='stu'){const[us,ss,vw,rs]=await Promise.all([all('users'),all('subs'),all('views'),all('results')]);const st=us.filter(x=>x.role==='student');
b=`<div class="cd tb"><h3>الطلاب (${st.length})</h3><table><tr><th>الاسم</th><th>التليفون</th><th>ولي الأمر</th><th>البطاقة</th><th>الفصول</th><th>المحاضرات المشاهدة</th><th>المستوى</th></tr>${st.map(s=>{const l=lvl(rs.filter(r=>r.uid===s.id));return `<tr><td>${esc(s.n)}</td><td dir="ltr">${esc(s.ph)}</td><td dir="ltr">${esc(s.pp)}</td><td>${s.im?`<img src="${s.im}" style="height:40px;border-radius:6px;cursor:pointer" onclick="lb(this.src)" alt="">`:'-'}</td><td>${ss.filter(k=>k.uid===s.id).map(k=>esc(cv(k.cid).t)).join('، ')||'-'}</td><td>${vw.filter(v=>v.uid===s.id).length}</td><td>${l[0]} — ${l[1]}</td></tr>`}).join('')}</table></div>`}
if(t==='qz'){const ch=await all('chapters');const D={};ch.forEach(x=>D[x.id]=(x.quiz||[]).length);
b=`<div class="cd"><h3>إضافة سؤال</h3><label>الفصل</label><select id="qc">${cop()}</select><label>السؤال</label><input id="qq">${[0,1,2,3].map(i=>`<label>الاختيار ${i+1}</label><input id="qo${i}">`).join('')}<label>الإجابة الصحيحة</label><select id="qa"><option value="0">1</option><option value="1">2</option><option value="2">3</option><option value="3">4</option></select><button onclick="addQ()">إضافة</button></div><div class="cd">${C.map(c=>`<p>${esc(c.t)}: ${D[c.id]||0} سؤال</p>`).join('')}</div>`}
if(t==='adm'&&mn()){const us=(await all('users')).filter(x=>x.role!=='student');
b=`<div class="cd"><h3>إضافة مشرف</h3><div class="two"><div><label>الاسم</label><input id="an"></div><div><label>رقم التليفون</label><input id="ap" dir="ltr"></div></div><label>كلمة السر</label><input id="aw" type="password"><button onclick="addA()">إضافة</button></div><div class="cd tb"><table><tr><th>الاسم</th><th>التليفون</th><th>الدور</th><th></th></tr>${us.map(x=>`<tr><td>${esc(x.n)}</td><td dir="ltr">${esc(x.ph)}</td><td>${x.role==='main'?'أدمن رئيسي':'مشرف'}</td><td>${x.role==='main'?'':`<button class="o s" onclick="delA('${x.id}')">إزالة الصلاحية</button>`}</td></tr>`).join('')}</table></div>`}
return b}
async function addV(){const t=$('#vt').value.trim(),y=yid($('#vu').value.trim()),cid=$('#vc').value;if(!t||!y)return alert('اكتب العنوان ورابط يوتيوب صحيح');
try{await setDoc(doc(db,'chapters',cid),{videos:arrayUnion({id:'v'+Date.now(),t,y})},{merge:true});admin()}catch(e){alert('تعذّر الحفظ')}}
async function delV(cid,id){if(!confirm('حذف المحاضرة؟'))return;try{const d=await getDoc(doc(db,'chapters',cid));const V=((d.data()||{}).videos||[]).filter(v=>v.id!==id);await setDoc(doc(db,'chapters',cid),{videos:V},{merge:true});admin()}catch(e){alert('تعذّر الحذف')}}
function rc(){const a=new Uint32Array(8),ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';crypto.getRandomValues(a);return 'AMR-'+[...a].slice(0,4).map(x=>ch[x%32]).join('')+'-'+[...a].slice(4).map(x=>ch[x%32]).join('')}
async function gen(){const cid=$('#kc').value,n=Math.min(+$('#kn').value||0,200);if(n<1)return;const b=writeBatch(db);A.last=[];
for(let i=0;i<n;i++){const c=rc();A.last.push(c);b.set(doc(db,'codes',c),{cid,used:false,uid:null,at:null,cr:Date.now()+i})}
try{await b.commit();admin()}catch(e){A.last=[];alert('تعذّر توليد الأكواد')}}
async function addQ(){const q=$('#qq').value.trim(),o=[0,1,2,3].map(i=>$('#qo'+i).value.trim()),c=$('#qc').value;if(!q||o.some(x=>!x))return alert('أكمل السؤال والاختيارات');
try{await setDoc(doc(db,'chapters',c),{quiz:arrayUnion({q,o,a:+$('#qa').value})},{merge:true});admin()}catch(e){alert('تعذّر الحفظ')}}
async function addA(){const n=$('#an').value.trim(),ph=$('#ap').value.trim(),pw=$('#aw').value;if(!n||!/^01\d{9}$/.test(ph)||pw.length<6)return alert('أكمل البيانات (كلمة السر ٦ أحرف على الأقل)');
try{const a2=getAuth(initializeApp(FC,'sec'+Date.now()));const c=await createUserWithEmailAndPassword(a2,em(ph),pw);await setDoc(doc(db,'users',c.user.uid),{n,ph,pp:'',im:'',role:'admin',cr:Date.now()});await signOut(a2);admin()}
catch(e){alert(e.code==='auth/email-already-in-use'?'الرقم مسجّل قبل كده':'تعذّر إنشاء المشرف')}}
async function delA(id){if(!confirm('إزالة صلاحية المشرف؟'))return;try{await updateDoc(doc(db,'users',id),{role:'student'});admin()}catch(e){alert('تعذّر التنفيذ')}}
